<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=480, height=480, initial-scale=1, user-scalable=no" />
    <title>Atlas Pulse</title>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        color: #f5f5f5;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none;
        touch-action: pan-y;
      }
      * { box-sizing: border-box; }
      /* Center the 480x480 frame when viewed on a larger display */
      #root {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* Hide scrollbars inside the kiosk frame */
      .kiosk-scroll::-webkit-scrollbar { display: none; }
      .kiosk-scroll { scrollbar-width: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
