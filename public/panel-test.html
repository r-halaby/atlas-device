<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=720, height=720, initial-scale=1">
  <title>Panel retention test</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden; }
    #stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font: 700 96px/1 -apple-system, sans-serif;
      color: #fff;
      transition: background 60ms linear, color 60ms linear;
    }
  </style>
</head>
<body>
  <div id="stage">BLACK</div>
  <script>
    const steps = [
      { bg: '#000000', fg: '#ffffff', label: 'BLACK' },
      { bg: '#ffffff', fg: '#000000', label: 'WHITE' },
      { bg: '#ff0000', fg: '#ffffff', label: 'RED' },
      { bg: '#00ff00', fg: '#000000', label: 'GREEN' },
      { bg: '#0000ff', fg: '#ffffff', label: 'BLUE' },
    ];
    let i = 0;
    const stage = document.getElementById('stage');
    function tick() {
      const s = steps[i % steps.length];
      stage.style.background = s.bg;
      stage.style.color = s.fg;
      stage.textContent = s.label;
      i++;
    }
    tick();
    // 4 seconds is long enough for panel retention to build up if it exists,
    // short enough to keep the test moving.
    setInterval(tick, 4000);
  </script>
</body>
</html>
